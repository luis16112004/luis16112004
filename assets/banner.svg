<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#0F2F3A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <pattern id="puntos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#5EEAD4" fill-opacity="0.18"/>
    </pattern>
    <clipPath id="marco"><rect width="1200" height="280" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#marco)">
    <rect width="1200" height="280" fill="url(#fondo)"/>
    <rect x="640" y="0" width="560" height="280" fill="url(#puntos)"/>

    <!-- Ondas de pulso, el mismo motivo de GeoPulso -->
    <g fill="none" stroke="#5EEAD4">
      <circle cx="1010" cy="140" r="60" stroke-opacity="0.35" stroke-width="2"/>
      <circle cx="1010" cy="140" r="105" stroke-opacity="0.22" stroke-width="2"/>
      <circle cx="1010" cy="140" r="150" stroke-opacity="0.12" stroke-width="2"/>
      <circle cx="1010" cy="140" r="195" stroke-opacity="0.06" stroke-width="2"/>
    </g>
    <g transform="translate(974 92) scale(3)">
      <path d="M12,2C8.13,2 5,5.13 5,9c0,5.25 7,13 7,13s7,-7.75 7,-13c0,-3.87 -3.13,-7 -7,-7z" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M8.6,9.2H10.1L10.9,7.3L12.2,11.1L13.1,8.4L13.7,9.2H15.4" fill="none" stroke="#0E7490" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Texto -->
    <rect x="64" y="70" width="56" height="6" rx="3" fill="url(#acento)"/>
    <text x="64" y="132" font-size="50" font-weight="700" fill="#FFFFFF">Luis David Casillas</text>
    <text x="64" y="176" font-size="25" font-weight="600" fill="#5EEAD4">Ingeniero de software</text>
    <text x="64" y="216" font-size="19" fill="#CBD5E1">Apps Android y web · de la idea a producción · Firebase · IA aplicada</text>
  </g>
</svg>
