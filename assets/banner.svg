<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#0F2F3A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <pattern id="puntos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#5EEAD4" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="marco"><rect width="1200" height="280" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#marco)">
    <rect width="1200" height="280" fill="url(#fondo)"/>
    <rect x="660" y="0" width="540" height="280" fill="url(#puntos)"/>

    <!-- Ventana de navegador: desarrollo web -->
    <g transform="translate(700 62)">
      <rect width="320" height="176" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
      <path d="M0,12 a12,12 0 0 1 12,-12 h296 a12,12 0 0 1 12,12 v20 h-320 z" fill="#1E293B"/>
      <circle cx="18" cy="16" r="4.5" fill="#F43F5E"/>
      <circle cx="34" cy="16" r="4.5" fill="#F59E0B"/>
      <circle cx="50" cy="16" r="4.5" fill="#10B981"/>
      <rect x="70" y="10" width="200" height="12" rx="6" fill="#334155"/>
      <rect x="20" y="50" width="120" height="10" rx="5" fill="#5EEAD4" fill-opacity="0.9"/>
      <rect x="20" y="70" width="190" height="8" rx="4" fill="#475569"/>
      <rect x="20" y="86" width="160" height="8" rx="4" fill="#475569"/>
      <rect x="20" y="112" width="84" height="44" rx="8" fill="#14B8A6" fill-opacity="0.25" stroke="#14B8A6" stroke-opacity="0.6"/>
      <rect x="114" y="112" width="84" height="44" rx="8" fill="#6366F1" fill-opacity="0.25" stroke="#6366F1" stroke-opacity="0.6"/>
      <rect x="208" y="112" width="84" height="44" rx="8" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-opacity="0.5"/>
    </g>

    <!-- Teléfono: desarrollo móvil -->
    <g transform="translate(980 34)">
      <rect width="118" height="214" rx="20" fill="#0B1220" stroke="#5EEAD4" stroke-opacity="0.7" stroke-width="2.5"/>
      <rect x="44" y="10" width="30" height="6" rx="3" fill="#334155"/>
      <rect x="12" y="28" width="94" height="44" rx="10" fill="url(#acento)" fill-opacity="0.85"/>
      <rect x="12" y="82" width="44" height="40" rx="8" fill="#1E293B"/>
      <rect x="62" y="82" width="44" height="40" rx="8" fill="#1E293B"/>
      <rect x="12" y="132" width="94" height="10" rx="5" fill="#334155"/>
      <rect x="12" y="150" width="70" height="10" rx="5" fill="#334155"/>
      <rect x="34" y="186" width="50" height="5" rx="2.5" fill="#475569"/>
    </g>

    <!-- Código -->
    <g transform="translate(660 182)">
      <rect width="74" height="50" rx="12" fill="#0F172A" stroke="#6366F1" stroke-opacity="0.7" stroke-width="2"/>
      <text x="37" y="33" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#A5B4FC">&lt;/&gt;</text>
    </g>

    <!-- Texto -->
    <rect x="64" y="70" width="56" height="6" rx="3" fill="url(#acento)"/>
    <text x="64" y="132" font-size="50" font-weight="700" fill="#FFFFFF">Luis David Casillas</text>
    <text x="64" y="176" font-size="25" font-weight="600" fill="#5EEAD4">Ingeniero de software</text>
    <text x="64" y="216" font-size="19" fill="#CBD5E1">Apps móviles · Web · Backend y nube · IA aplicada</text>
  </g>
</svg>
